_format_version: "3.0"
_transform: true

services:

  - name: student-service
    url: http://host.docker.internal:3001
    routes:
      - name: student-routes
        paths: ["/api/students"]
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 100
          policy: local
      - name: cors
        config:
          origins: ["http://localhost:4200","http://localhost:4201","http://localhost:4202","http://localhost:4203"]
          methods: ["GET","POST","PUT","PATCH","DELETE","OPTIONS"]
          headers: ["Authorization","Content-Type"]
          credentials: true

