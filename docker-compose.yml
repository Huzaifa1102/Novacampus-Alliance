services:

  # ─── DATABASES ───────────────────────────────────────────
  postgres:
    image: postgres:17
    container_name: nca_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: nca_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MESSAGE BROKER ──────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: nca_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: novacampus
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── AUTH ────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: nca_keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ./auth/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"

  # ─── API GATEWAY ─────────────────────────────────────────
  kong:
    image: kong:3.4
    container_name: nca_kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
    volumes:
      - ./gateway/kong.yml:/etc/kong/kong.yml
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      - keycloak

  # ─── MONITORING ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: nca_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: nca_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus

  # ─── MICROSERVICES ───────────────────────────────────────
  student-service:
    build: ./services/student-service
    container_name: nca_student_service
    restart: unless-stopped
    env_file: ./services/student-service/.env.docker
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - rabbitmq

  academic-service:
    build:
      context: ./services/academic-service
    container_name: nca_academic_service
    environment:
      - DATABASE_URL=postgresql://novacampus:novacampus123@postgres:5432/novacampus_db
      - PORT=3002
    ports:
      - "3002:3002"
    depends_on:
      - postgres

  chatbot-service:
    build:
      context: ./services/chatbot-service
    container_name: nca_chatbot_service
    environment:
      - PORT=3006
      - PYTHONPATH=/app/src
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ACADEMIC_SERVICE_URL=http://academic-service:3002
      - SCHEDULING_SERVICE_URL=http://scheduling-service:3003
      - FINANCIAL_SERVICE_URL=http://financial-service:3004
      - MONGO_URI=mongodb://mongodb:27017/novacampus
    ports:
      - "3006:3006"
    depends_on:
      mongodb:
        condition: service_healthy

  financial-service:
    build:
      context: ./services/financial-service
    container_name: nca_financial_service
    environment:
      - DATABASE_URL=postgresql://novacampus:novacampus123@postgres:5432/novacampus_db
      - PORT=3004
      - RABBITMQ_URL=amqp://novacampus:${RABBITMQ_PASSWORD}@rabbitmq:5672
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  scheduling-service:
    build:
      context: ./services/scheduling-service
    container_name: nca_scheduling_service
    environment:
      - DATABASE_URL=postgresql://novacampus:novacampus123@postgres:5432/novacampus_db
      - PORT=3003
      - RABBITMQ_URL=amqp://novacampus:${RABBITMQ_PASSWORD}@rabbitmq:5672
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  reporting-service:
    build:
      context: ./services/reporting-service
    container_name: nca_reporting_service
    environment:
      - DATABASE_URL=postgresql://novacampus:novacampus123@postgres:5432/novacampus_db
      - PORT=3005
    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  mongo_data: